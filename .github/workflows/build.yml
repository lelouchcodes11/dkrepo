name: Build and Publish CloudStream Extensions

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build 7Movies Extension
        run: |
          cd 7movies-extension
          chmod +x gradlew
          ./gradlew :provider:assembleDebug --no-daemon
          cp provider/build/outputs/apk/debug/provider-debug.apk ../SevenMovies.cs3

      - name: Build Cno Extension
        run: |
          cd cno-extension
          chmod +x gradlew
          ./gradlew :provider:assembleDebug --no-daemon
          cp provider/build/outputs/apk/debug/provider-debug.apk ../CnoTo.cs3

      - name: Update plugins.json
        run: |
          export HASH_7M=$(sha256sum SevenMovies.cs3 | awk '{print $1}')
          export SIZE_7M=$(wc -c < SevenMovies.cs3 | tr -d ' ')
          export HASH_CNO=$(sha256sum CnoTo.cs3 | awk '{print $1}')
          export SIZE_CNO=$(wc -c < CnoTo.cs3 | tr -d ' ')
          echo "Built SevenMovies.cs3: $SIZE_7M bytes, sha256-$HASH_7M"
          echo "Built CnoTo.cs3: $SIZE_CNO bytes, sha256-$HASH_CNO"
          python3 -c "
          import json, os
          h7 = os.environ['HASH_7M']
          s7 = int(os.environ['SIZE_7M'])
          hc = os.environ['HASH_CNO']
          sc = int(os.environ['SIZE_CNO'])
          with open('plugins.json', 'r') as f:
              data = json.load(f)
          for p in data:
              if p.get('internalName') == 'SevenMovies':
                  p['fileHash'] = f'sha256-{h7}'
                  p['fileSize'] = s7
              elif p.get('internalName') == 'CnoTo':
                  p['fileHash'] = f'sha256-{hc}'
                  p['fileSize'] = sc
          with open('plugins.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push to builds branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds
          git worktree add ../builds-dir origin/builds
          cp SevenMovies.cs3 CnoTo.cs3 repo.json plugins.json ../builds-dir/
          cd ../builds-dir
          git add SevenMovies.cs3 CnoTo.cs3 repo.json plugins.json
          git diff --staged --quiet || git commit -m "Automated build [skip ci]"
          git push origin HEAD:builds
